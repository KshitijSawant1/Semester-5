<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NWT Exp 9 </title>

    <!-- CSS 1: Layout & Text -->
    <style>
      :root {
        --bg: #f7f9fc;
        --fg: #222;
        --accent: #2563eb;
        --ok: #10b981;
        --line: #e5e7eb;
        --dark: #111827;
        --darkfg: #e5e7eb;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header,
      footer {
        background: #fff;
        border: 1px solid var(--line);
        padding: 12px 16px;
        text-align: center;
      }
      main {
        max-width: 800px;
        margin: 20px auto;
        padding: 0 16px;
      }
    </style>

    <!-- CSS 2: Components -->
    <style>
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .dark {
        background: var(--dark) !important;
        color: var(--darkfg) !important;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        border: 0;
        background: var(--accent);
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
      .badge {
        background: var(--ok);
        color: #fff;
        border-radius: 999px;
        padding: 5px 10px;
        font-weight: 600;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .box {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
      }
      .log {
        background: #0b1020;
        color: #d1d5db;
        border-radius: 8px;
        padding: 10px;
        min-height: 80px;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <header>
      <h2>NWT Exp 9 : Kshitij K Sawant</h2>
      <small>HTML5 + CSS3 + JavaScript Events</small>
    </header>

    <main>
      <section class="card" id="card">
        <h3 id="title">Welcome</h3>
        <p id="msg">Use the buttons or the form to change this card.</p>
        <div class="row">
          <button id="btnTheme">Dark Mode</button>
          <button id="btnCount">Count +1</button>
          <span class="badge" id="count">0</span>
        </div>
      </section>

      <section class="card">
        <h4>Update Card</h4>
        <form id="form">
          <label>Title <input id="inTitle" placeholder="New title" /></label>
          <label>Message <input id="inMsg" placeholder="New message" /></label>
          <button type="submit">Apply</button>
        </form>
        <small>Submit is prevented; JS updates text.</small>
      </section>

      <section class="card">
        <h4>Event Flow Demo</h4>
        <div id="parent" class="box">
          Parent
          <div id="child" class="box">Child</div>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <footer><small>Practical ~ Oral Examination</small></footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const card = $("card"),
        btnTheme = $("btnTheme"),
        btnCount = $("btnCount");
      const count = $("count"),
        form = $("form"),
        inTitle = $("inTitle"),
        inMsg = $("inMsg");
      const title = $("title"),
        msg = $("msg"),
        parent = $("parent"),
        child = $("child"),
        log = $("log");

      // Dark mode
      btnTheme.onclick = () => card.classList.toggle("dark");

      // Counter
      let n = 0;
      btnCount.onclick = () => {
        count.textContent = ++n;
      };

      // Form -> update text
      form.onsubmit = (e) => {
        e.preventDefault();
        const t = inTitle.value.trim(),
          m = inMsg.value.trim();
        if (t) title.textContent = t;
        if (m) msg.textContent = m;
        inTitle.value = inMsg.value = "";
      };

      // Event flow: capture vs bubble
      parent.addEventListener("click", () => logIt("Parent (capture)"), {
        capture: true,
      });
      parent.addEventListener("click", () => logIt("Parent (bubble)"));
      child.addEventListener("click", () => logIt("Child (capture)"), {
        capture: true,
      });
      child.addEventListener("click", () => logIt("Child (bubble)"));

      function logIt(text) {
        const t = new Date().toLocaleTimeString();
        log.textContent += `[${t}] ${text}\n`;
        log.scrollTop = log.scrollHeight;
      }
    </script>
  </body>
</html>
